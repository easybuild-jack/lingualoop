<!DOCTYPE html>
<html lang="zh-CN" data-bg="video-pink" data-nav="sidebar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaLoop · 液态毛玻璃 6大交互完整测试页</title>
  <style>
    @font-face {
      font-family: "Newsreader";
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url("/fonts/newsreader-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Newsreader";
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url("/fonts/newsreader-latin-ext.woff2") format("woff2");
    }

    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;

      /* ===== 默认：教室黑板（无光晕、沉静哑光深墨绿） ===== */
      --bg-base: #1a2922;
      --fg: #f3f6f2;
      --fg-soft: #d2dcd5;
      --muted-fg: #90a499;
      --primary: #7be0c3;
      --primary-rgb: 123, 224, 195;
      --accent: #f6d365;
      --accent-soft: #fce7a2;
      --danger: #f87171;

      --glass-bg: linear-gradient(148deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.032) 55%, rgba(255, 255, 255, 0.06) 100%);
      --glass-solid: rgba(24, 39, 32, 0.72);
      --glass-sub: rgba(12, 22, 18, 0.34);
      --glass-anchor-bg: #121c18;
      --glass-anchor-fg: #f5f7f4;
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-highlight: rgba(255, 255, 255, 0.34);
      --glass-shadow: 0 22px 54px -18px rgba(5, 12, 9, 0.62), 0 4px 16px rgba(5, 12, 9, 0.28);
      --pill-bg: rgba(255, 255, 255, 0.075);
      --pill-solid: #24382f;
      --pill-hover: rgba(255, 255, 255, 0.14);
      --nav-pill-bg: rgba(255, 255, 255, 0.13);
      --nav-pill-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.36), 0 8px 20px -8px rgba(0, 0, 0, 0.45);
      --divider: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.22);
      --line-soft: rgba(255, 255, 255, 0.10);
      --kbd-bg: rgba(255, 255, 255, 0.08);
      --modal-bg: rgba(20, 33, 27, 0.88);
      --spot-color: rgba(123, 224, 195, 0.13);
      --spot-border: rgba(123, 224, 195, 0.65);
      --board-opacity: 1;
      --sunset-opacity: 0;
    }

    /* ===== 纯淡雾青（无光晕） ===== */
    [data-bg="pale-mist"] {
      --bg-base: #eaf1ef;
      --fg: #182624;
      --fg-soft: #374a47;
      --muted-fg: #667c78;
      --primary: #0f7f73;
      --primary-rgb: 15, 127, 115;
      --accent: #c97308;
      --accent-soft: #a15507;
      --danger: #dc2626;

      --glass-bg: linear-gradient(148deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.52) 54%, rgba(255, 255, 255, 0.72) 100%);
      --glass-solid: rgba(255, 255, 255, 0.76);
      --glass-sub: rgba(255, 255, 255, 0.52);
      --glass-anchor-bg: #1c2422;
      --glass-anchor-fg: #f4f7f6;
      --glass-border: rgba(255, 255, 255, 0.90);
      --glass-highlight: rgba(255, 255, 255, 1);
      --glass-shadow: 0 22px 48px -18px rgba(24, 52, 48, 0.14), 0 4px 14px rgba(24, 52, 48, 0.06);
      --pill-bg: rgba(255, 255, 255, 0.66);
      --pill-solid: #ffffff;
      --pill-hover: rgba(255, 255, 255, 0.96);
      --nav-pill-bg: rgba(255, 255, 255, 0.88);
      --nav-pill-shadow: inset 0 1px 0 #ffffff, 0 8px 20px -8px rgba(20, 56, 52, 0.16);
      --divider: rgba(24, 52, 48, 0.09);
      --line-strong: rgba(24, 52, 48, 0.22);
      --line-soft: rgba(24, 52, 48, 0.11);
      --kbd-bg: rgba(255, 255, 255, 0.85);
      --modal-bg: rgba(252, 254, 253, 0.90);
      --spot-color: rgba(15, 127, 115, 0.10);
      --spot-border: rgba(15, 127, 115, 0.50);
      --board-opacity: 0;
      --sunset-opacity: 0;
    }

    /* ===== 纯淡米纸（无光晕） ===== */
    [data-bg="pale-paper"] {
      --bg-base: #f3efe6;
      --fg: #211d18;
      --fg-soft: #433c34;
      --muted-fg: #7a7166;
      --primary: #c26b46;
      --primary-rgb: 194, 107, 70;
      --accent: #b45309;
      --accent-soft: #92400e;
      --danger: #dc2626;

      --glass-bg: linear-gradient(148deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.54) 54%, rgba(255, 255, 255, 0.72) 100%);
      --glass-solid: rgba(255, 253, 249, 0.78);
      --glass-sub: rgba(255, 255, 255, 0.52);
      --glass-anchor-bg: #1b1b19;
      --glass-anchor-fg: #faf8f5;
      --glass-border: rgba(255, 255, 255, 0.92);
      --glass-highlight: rgba(255, 255, 255, 1);
      --glass-shadow: 0 22px 48px -18px rgba(64, 52, 36, 0.13), 0 4px 14px rgba(64, 52, 36, 0.06);
      --pill-bg: rgba(255, 255, 255, 0.68);
      --pill-solid: #fffdf9;
      --pill-hover: rgba(255, 255, 255, 0.96);
      --nav-pill-bg: rgba(255, 255, 255, 0.90);
      --nav-pill-shadow: inset 0 1px 0 #ffffff, 0 8px 20px -8px rgba(64, 52, 36, 0.15);
      --divider: rgba(64, 52, 36, 0.09);
      --line-strong: rgba(64, 52, 36, 0.22);
      --line-soft: rgba(64, 52, 36, 0.11);
      --kbd-bg: rgba(255, 255, 255, 0.85);
      --modal-bg: rgba(255, 253, 249, 0.92);
      --spot-color: rgba(194, 107, 70, 0.11);
      --spot-border: rgba(194, 107, 70, 0.55);
      --board-opacity: 0;
      --sunset-opacity: 0;
    }

    /* ===== 视频同款纯裸粉（纯色无渐变无光晕） ===== */
    [data-bg="video-pink"] {
      --bg-base: #DFC6BD;
      --fg: #1d1a18;
      --fg-soft: #443b36;
      --muted-fg: #756760;
      --primary: #c26b46;
      --primary-rgb: 194, 107, 70;
      --accent: #b45309;
      --accent-soft: #92400e;
      --danger: #dc2626;

      --glass-bg: linear-gradient(148deg, rgba(255, 255, 255, 0.64) 0%, rgba(255, 255, 255, 0.44) 55%, rgba(255, 255, 255, 0.58) 100%);
      --glass-solid: rgba(255, 255, 255, 0.66);
      --glass-sub: rgba(243, 241, 241, 0.72);
      --glass-anchor-bg: #1b1b19;
      --glass-anchor-fg: #faf8f5;
      --glass-border: rgba(255, 255, 255, 0.74);
      --glass-highlight: rgba(255, 255, 255, 0.94);
      --glass-shadow: 0 24px 56px -18px rgba(84, 52, 36, 0.16), 0 4px 16px rgba(84, 52, 36, 0.08);
      --pill-bg: rgba(255, 255, 255, 0.54);
      --pill-solid: #faf6f3;
      --pill-hover: rgba(255, 255, 255, 0.88);
      --nav-pill-bg: rgba(255, 255, 255, 0.82);
      --nav-pill-shadow: inset 0 1px 0 #ffffff, 0 10px 24px -8px rgba(84, 52, 36, 0.18);
      --divider: rgba(64, 46, 36, 0.09);
      --line-strong: rgba(64, 46, 36, 0.22);
      --line-soft: rgba(64, 46, 36, 0.11);
      --kbd-bg: rgba(255, 255, 255, 0.80);
      --modal-bg: rgba(255, 251, 248, 0.90);
      --spot-color: rgba(194, 107, 70, 0.12);
      --spot-border: rgba(194, 107, 70, 0.62);
      --board-opacity: 0;
      --sunset-opacity: 0;
    }

    /* ===== 更浅一点的纯柔淡粉（纯色无渐变无光晕） ===== */
    [data-bg="soft-pink"] {
      --bg-base: #EDD9D2;
      --fg: #1d1a18;
      --fg-soft: #443b36;
      --muted-fg: #756760;
      --primary: #c26b46;
      --primary-rgb: 194, 107, 70;
      --accent: #b45309;
      --accent-soft: #92400e;
      --danger: #dc2626;

      --glass-bg: linear-gradient(148deg, rgba(255, 255, 255, 0.70) 0%, rgba(255, 255, 255, 0.48) 55%, rgba(255, 255, 255, 0.64) 100%);
      --glass-solid: rgba(255, 255, 255, 0.72);
      --glass-sub: rgba(246, 244, 243, 0.76);
      --glass-anchor-bg: #1b1b19;
      --glass-anchor-fg: #faf8f5;
      --glass-border: rgba(255, 255, 255, 0.82);
      --glass-highlight: rgba(255, 255, 255, 0.96);
      --glass-shadow: 0 22px 50px -18px rgba(84, 52, 36, 0.14), 0 4px 14px rgba(84, 52, 36, 0.06);
      --pill-bg: rgba(255, 255, 255, 0.58);
      --pill-solid: #fcf9f7;
      --pill-hover: rgba(255, 255, 255, 0.90);
      --nav-pill-bg: rgba(255, 255, 255, 0.86);
      --nav-pill-shadow: inset 0 1px 0 #ffffff, 0 10px 22px -8px rgba(84, 52, 36, 0.15);
      --divider: rgba(64, 46, 36, 0.09);
      --line-strong: rgba(64, 46, 36, 0.22);
      --line-soft: rgba(64, 46, 36, 0.11);
      --kbd-bg: rgba(255, 255, 255, 0.84);
      --modal-bg: rgba(255, 252, 250, 0.92);
      --spot-color: rgba(194, 107, 70, 0.11);
      --spot-border: rgba(194, 107, 70, 0.56);
      --board-opacity: 0;
      --sunset-opacity: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      background: var(--bg-base);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      transition: background-color 0.4s ease, color 0.3s ease;
    }

    /* ===== 背景层 1：教室黑板哑光肌理（无光晕） ===== */
    .blackboard-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: var(--board-opacity);
      transition: opacity 0.45s ease;
      background-image:
        repeating-linear-gradient(
          -6deg,
          rgba(255, 255, 255, 0.012) 0px,
          rgba(255, 255, 255, 0.012) 2px,
          transparent 2px,
          transparent 14px
        ),
        linear-gradient(180deg, rgba(8, 16, 12, 0.20) 0%, transparent 18%, transparent 82%, rgba(7, 14, 10, 0.26) 100%);
    }
    .blackboard-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: calc(var(--board-opacity) * 0.055);
      transition: opacity 0.45s ease;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='c'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23c)'/%3E%3C/svg%3E");
    }
    .chalk-ledge {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 5px;
      pointer-events: none;
      z-index: 3;
      opacity: var(--board-opacity);
      background: linear-gradient(180deg, #6d523b 0%, #4b3625 65%, #342418 100%);
      transition: opacity 0.45s ease;
    }

    /* ===== 背景层 2：视频同款柔和晚霞渐变（仅切到暖霞对比时显现） ===== */
    .sunset-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: var(--sunset-opacity);
      transition: opacity 0.5s ease;
      background:
        radial-gradient(ellipse 65% 55% at 15% 12%, #E4C0A6 0%, transparent 70%),
        radial-gradient(ellipse 70% 60% at 82% 85%, #EBD7CC 0%, transparent 72%),
        linear-gradient(145deg, #E4C0A6 0%, #D4B8AC 48%, #EBD7CC 100%);
    }

    /* ===== 应用骨架 ===== */
    .app-shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      transition: filter 0.3s ease;
    }
    body.cmd-open .app-shell {
      filter: blur(8px) brightness(0.92);
    }

    /* =====================================================================
       交互 01：左侧液态玻璃菜单栏 + 液态高亮块 (LIQUID PILL)
       ===================================================================== */
    .sidebar {
      width: 232px;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 16px 12px 14px;
      display: flex;
      flex-direction: column;
      background: var(--glass-bg);
      border-right: 1px solid var(--glass-border);
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.08);
      transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1), padding 0.38s ease, opacity 0.28s ease;
      overflow: hidden;
      z-index: 20;
    }
    [data-nav="dock"] .sidebar {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-right-color: transparent;
      opacity: 0;
      pointer-events: none;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 14px;
      flex-shrink: 0;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 19px;
      color: var(--primary);
      background: rgba(var(--primary-rgb), 0.15);
      border: 1px solid rgba(var(--primary-rgb), 0.30);
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      flex-shrink: 0;
    }
    .brand-text h1 {
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 500;
      line-height: 1.05;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .brand-text span {
      font-size: 10.5px;
      color: var(--muted-fg);
      letter-spacing: 0.28em;
    }

    /* 侧栏快速命令入口 */
    .sidebar-cmd-btn {
      margin: 0 4px 10px;
      height: 34px;
      padding: 0 11px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: var(--pill-bg);
      color: var(--muted-fg);
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .sidebar-cmd-btn:hover {
      background: var(--pill-hover);
      color: var(--fg);
    }

    .nav-scroll {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 2px 4px;
      scrollbar-width: none;
    }
    .nav-scroll::-webkit-scrollbar { display: none; }

    /* 液态滑动高亮胶囊（带运动拉伸果冻感） */
    .liquid-nav-pill {
      position: absolute;
      left: 4px;
      right: 4px;
      top: 0;
      height: 36px;
      border-radius: 9999px;
      background: var(--nav-pill-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--nav-pill-shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
      z-index: 0;
      transform-origin: center center;
      will-change: transform;
    }

    .nav-item {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 36px;
      padding: 0 12px;
      margin-bottom: 2px;
      border-radius: 9999px;
      border: none;
      background: transparent;
      color: var(--muted-fg);
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: color 0.22s ease;
      text-align: left;
    }
    .nav-item:hover {
      color: var(--fg);
    }
    .nav-item.active {
      color: var(--fg);
      font-weight: 500;
    }
    .nav-item.active svg {
      color: var(--primary);
    }
    .nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      transition: color 0.22s ease, transform 0.22s ease;
    }
    .nav-item:hover svg {
      transform: scale(1.08);
    }

    .sidebar-footer {
      flex-shrink: 0;
      padding-top: 10px;
      margin-top: 6px;
      border-top: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ===== 右侧主舞台区 ===== */
    .main-area {
      flex: 1;
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 24px 18px;
      gap: 12px;
      transition: padding-bottom 0.35s ease;
    }
    [data-nav="dock"] .main-area {
      padding-bottom: 92px;
    }

    /* ===== 预览体验控制台条 ===== */
    .demo-bar {
      width: min(1020px, 95vw);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      font-size: 12px;
    }
    .demo-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .demo-label {
      color: var(--muted-fg);
      font-weight: 500;
      margin-right: 2px;
    }
    .demo-chip {
      height: 25px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted-fg);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .demo-chip:hover { color: var(--fg); background: var(--pill-hover); }
    .demo-chip.active {
      color: var(--fg);
      background: rgba(var(--primary-rgb), 0.16);
      border-color: rgba(var(--primary-rgb), 0.34);
      box-shadow: inset 0 1px 0 var(--glass-highlight);
    }
    .swatch {
      width: 8px; height: 8px; border-radius: 50%;
      border: 1px solid rgba(128,128,128,0.35);
    }

    /* ===== 顶部工具栏（含交互 04：水滴分裂筛选） ===== */
    .top-toolbar {
      width: min(1020px, 95vw);
      min-height: 54px;
      padding: 6px 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
      box-shadow: inset 0 1px 0 var(--glass-highlight), 0 10px 28px -14px rgba(0, 0, 0, 0.22);
      z-index: 15;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted-fg);
      cursor: pointer;
    }
    .breadcrumb strong { color: var(--fg); font-weight: 600; }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* =====================================================================
       交互 04：水滴分裂筛选 (LIQUID SPLIT — SVG Gooey Metaball)
       ===================================================================== */
    .gooey-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 36px;
      filter: url(#gooey-filter);
      padding: 2px 4px;
    }
    .gooey-trigger {
      position: relative;
      z-index: 3;
      height: 32px;
      padding: 0 13px;
      border-radius: 999px;
      border: none;
      background: var(--pill-solid);
      color: var(--fg);
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gooey-trigger:active { transform: scale(0.94); }

    .gooey-options {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 0;
      max-width: 0;
      opacity: 0;
      overflow: visible;
      pointer-events: none;
      transition: max-width 0.42s cubic-bezier(0.34, 1.45, 0.64, 1), margin-left 0.35s ease, opacity 0.25s ease;
    }
    .gooey-wrap.open .gooey-options {
      max-width: 260px;
      margin-left: 8px;
      opacity: 1;
      pointer-events: auto;
    }

    .gooey-opt {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: none;
      background: var(--pill-solid);
      color: var(--muted-fg);
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      transform: translateX(-28px) scale(0.6);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease, background 0.2s ease;
    }
    .gooey-wrap.open .gooey-opt {
      transform: translateX(0) scale(1);
    }
    .gooey-wrap.open .gooey-opt:nth-child(2) { transition-delay: 0.04s; }
    .gooey-wrap.open .gooey-opt:nth-child(3) { transition-delay: 0.08s; }
    .gooey-wrap.open .gooey-opt:nth-child(4) { transition-delay: 0.12s; }
    .gooey-opt:hover { color: var(--fg); }
    .gooey-opt.selected {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
    }
    [data-bg="blackboard"] .gooey-opt.selected {
      color: #0e1d17;
    }

    .glass-pill-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--pill-bg);
      color: var(--fg-soft);
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glass-pill-btn:hover {
      background: var(--pill-hover);
      color: var(--fg);
      transform: translateY(-1px);
    }
    .glass-pill-btn.active {
      color: var(--primary);
      background: rgba(var(--primary-rgb), 0.15);
      border-color: rgba(var(--primary-rgb), 0.36);
    }
    .glass-pill-btn.starred {
      color: var(--accent);
      background: rgba(246, 211, 101, 0.14);
      border-color: rgba(246, 211, 101, 0.38);
    }

    .progress-rail {
      position: absolute;
      left: 18px; right: 18px; bottom: 0;
      height: 2.5px;
      border-radius: 999px;
      background: var(--divider);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 25%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* =====================================================================
       交互 02：光跟着鼠标走 (LIGHT FOLLOW + 局部边框点亮 + 轻微 3D 倾角)
       ===================================================================== */
    .light-card {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.22s ease-out, box-shadow 0.3s ease;
    }
    .light-card::before {
      /* 内部柔光追随 */
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        340px circle at var(--mx, 50%) var(--my, 50%),
        var(--spot-color),
        transparent 68%
      );
      transition: opacity 0.3s ease;
      z-index: 0;
    }
    .light-card::after {
      /* 鼠标附近 1px 玻璃边框局部点亮 */
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        220px circle at var(--mx, 50%) var(--my, 50%),
        var(--spot-border),
        transparent 65%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      transition: opacity 0.3s ease;
      z-index: 3;
    }
    .light-card:hover::before,
    .light-card:hover::after {
      opacity: 1;
    }

    /* ===== 中央主学习舞台 + 交互 03：模块就地放大 ===== */
    .stage-row {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
    }

    .nav-drop-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--muted-fg);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 var(--glass-highlight), 0 10px 24px -10px rgba(0, 0, 0, 0.25);
      transition: all 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .nav-drop-btn:hover {
      color: var(--fg);
      transform: scale(1.08);
    }
    .nav-drop-btn:active { transform: scale(0.94); }

    /* 主玻璃容器（双层玻璃嵌套底座） */
    .stage-container {
      width: min(940px, 88vw);
      min-height: 585px;
      border-radius: 26px;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      box-shadow: inset 0 1.5px 0 var(--glass-highlight), var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }

    .stage-modules {
      flex: 1;
      display: grid;
      grid-template-columns: 1.62fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 14px;
      min-height: 0;
    }

    /* 当有模块处于「就地放大」态时 */
    .stage-container.has-expanded .stage-modules {
      display: flex;
      flex-direction: column;
    }
    .stage-container.has-expanded .module-card:not(.is-expanded) {
      display: none;
    }
    .stage-container.has-expanded .module-card.is-expanded {
      flex: 1;
      min-height: 450px;
      animation: expand-in 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes expand-in {
      from { opacity: 0.72; transform: scale(0.965); }
      to { opacity: 1; transform: scale(1); }
    }

    /* 模块通用样式 */
    .module-card {
      border-radius: 20px;
      padding: 16px 20px;
      background: var(--glass-sub);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .module-card > * { position: relative; z-index: 1; }

    /* 上半区：单词跟打主卡 */
    .hero-module {
      grid-column: 1 / -1;
      padding: 16px 24px 18px;
      text-align: center;
    }

    /* 深色锚点质感卡片（借鉴视频里的深色锚点设计，用于构词记忆卡） */
    .etymology-module.anchor-dark {
      background: var(--glass-anchor-bg);
      color: var(--glass-anchor-fg);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .etymology-module.anchor-dark .panel-meta,
    .etymology-module.anchor-dark .morpheme-meaning {
      color: rgba(255, 255, 255, 0.62);
    }
    .etymology-module.anchor-dark .derivation-text {
      color: rgba(255, 255, 255, 0.84);
    }
    .etymology-module.anchor-dark .morpheme-chip {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .etymology-module.anchor-dark .morpheme-text {
      color: #ffffff;
    }
    .etymology-module.anchor-dark .morpheme-chip.root {
      background: rgba(var(--primary-rgb), 0.20);
      border-color: rgba(var(--primary-rgb), 0.45);
    }

    .expand-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--pill-bg);
      color: var(--muted-fg);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .expand-btn:hover {
      color: var(--fg);
      background: var(--pill-hover);
      transform: scale(1.06);
    }
    .etymology-module.anchor-dark .expand-btn {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.72);
    }
    .etymology-module.anchor-dark .expand-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.18);
    }

    /* 底部玻璃缩略图条（模块放大时出现） */
    .thumb-strip {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 6px;
      animation: fade-up 0.28s ease;
    }
    .stage-container.has-expanded .thumb-strip {
      display: flex;
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .thumb-pill {
      height: 36px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--pill-bg);
      color: var(--fg-soft);
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      transition: all 0.2s ease;
    }
    .thumb-pill:hover {
      background: var(--pill-hover);
      transform: translateY(-2px);
      color: var(--fg);
    }
    .thumb-pill.restore-btn {
      color: var(--primary);
      border-color: rgba(var(--primary-rgb), 0.35);
    }

    /* ===== 单词跟打内容 ===== */
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .loop-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--glass-border);
      font-size: 12.5px;
      color: var(--muted-fg);
    }
    .loop-dots { display: inline-flex; gap: 5px; }
    .loop-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--divider);
      transition: background 0.25s ease;
    }
    .loop-dot.filled { background: var(--primary); }

    .word-headline {
      font-family: var(--font-serif);
      font-size: clamp(2.9rem, 5.4vw, 4.4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.08;
      color: var(--fg);
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .seg-vowel { color: var(--primary); }
    .seg-combo { color: var(--accent); }
    .seg-combo-alt { color: var(--accent-soft); }
    .syl-dot { color: var(--muted-fg); opacity: 0.55; padding: 0 0.08em; }

    .phonetics-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
    }
    .phonetic-pill {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--pill-bg);
      color: var(--fg-soft);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      transition: all 0.2s ease;
    }
    .phonetic-pill:hover {
      background: var(--pill-hover);
      color: var(--fg);
      border-color: rgba(var(--primary-rgb), 0.36);
    }
    .phonetic-pill .ipa { font-family: var(--font-serif); font-size: 17px; }
    .phonetic-pill .tag { font-size: 11px; color: var(--muted-fg); }

    .word-meaning {
      margin-top: 10px;
      font-size: 16px;
      color: var(--fg-soft);
      line-height: 1.5;
    }
    .word-meaning .pos {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--muted-fg);
      margin-right: 6px;
    }

    /* 四线三格 */
    .typing-stage {
      position: relative;
      width: min(520px, 100%);
      height: 70px;
      margin: 10px auto 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .typing-stage.shake { animation: shake-x 0.22s ease-in-out; }
    @keyframes shake-x {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .four-lines {
      position: absolute;
      inset: 7px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .four-lines div:nth-child(1),
    .four-lines div:nth-child(3) { border-bottom: 1px solid var(--line-strong); }
    .four-lines div:nth-child(2) { border-bottom: 1px dashed var(--line-soft); }
    .four-lines div:nth-child(4) { border-bottom: 1px solid var(--line-soft); }
    .typing-stage.typo .four-lines div { border-color: rgba(248, 113, 113, 0.48); }

    .typing-slots {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      height: 100%;
      font-family: var(--font-mono);
      font-size: clamp(1.9rem, 3.2vw, 2.6rem);
    }
    .char-slot {
      position: relative;
      width: 1.05ch;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .char-slot .typed-char {
      transform: translateY(-4px);
      color: var(--fg);
      animation: char-pop 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .char-slot .typed-char.wrong { color: var(--danger); font-weight: 600; }
    @keyframes char-pop {
      from { transform: translateY(-10px) scale(1.08); opacity: 0.4; }
      to { transform: translateY(-4px) scale(1); opacity: 1; }
    }
    .char-slot .caret {
      position: absolute;
      left: 0; top: 11px; bottom: 16px;
      width: 2px; border-radius: 999px;
      background: var(--primary);
      animation: blink 0.95s infinite;
    }
    .typing-stage.typo .char-slot .caret { background: var(--danger); }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
    .char-slot .dash {
      position: absolute;
      bottom: 6px; left: 22%; right: 22%;
      height: 2px; border-radius: 999px;
      background: var(--line-strong);
    }
    .char-slot.filled .dash { opacity: 0; }

    .key-ripple {
      position: absolute;
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(var(--primary-rgb), 0.65);
      pointer-events: none;
      animation: key-ripple-out 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes key-ripple-out {
      0% { transform: scale(0.5); opacity: 0.85; }
      100% { transform: scale(3); opacity: 0; }
    }

    /* ===== 下半区例句/短语 & 构词 ===== */
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    /* 例句/短语液态滑动 Tab */
    .seg-tabs {
      position: relative;
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--divider);
    }
    .seg-pill {
      position: absolute;
      top: 3px;
      left: 3px;
      height: 26px;
      border-radius: 999px;
      background: var(--nav-pill-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--nav-pill-shadow);
      pointer-events: none;
      transition: transform 0.32s cubic-bezier(0.34, 1.45, 0.64, 1), width 0.32s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .seg-tab {
      position: relative;
      z-index: 1;
      height: 26px;
      padding: 0 14px;
      border: none;
      background: transparent;
      color: var(--muted-fg);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .seg-tab.active { color: var(--fg); }

    .panel-meta { font-size: 12px; color: var(--muted-fg); }

    .sentence-list { display: flex; flex-direction: column; gap: 11px; text-align: left; }
    .sentence-item {
      display: grid;
      grid-template-columns: 18px 1fr 28px;
      gap: 8px;
      align-items: start;
      padding-top: 10px;
      border-top: 1px dashed var(--divider);
    }
    .sentence-item:first-child { padding-top: 0; border-top: none; }
    .sentence-idx { font-family: var(--font-serif); color: var(--muted-fg); font-size: 14px; }
    .sentence-en { font-family: var(--font-serif); font-size: 16px; line-height: 1.48; color: var(--fg); }
    .sentence-en .hl-word {
      color: var(--primary);
      border-bottom: 1px dashed rgba(var(--primary-rgb), 0.55);
      cursor: pointer;
    }
    .sentence-cn { font-size: 13px; color: var(--muted-fg); margin-top: 3px; line-height: 1.45; }
    .mini-audio-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: none; background: transparent;
      color: var(--muted-fg); display: grid; place-items: center; cursor: pointer;
    }
    .mini-audio-btn:hover { color: var(--primary); background: var(--pill-bg); }

    .phrases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; text-align: left; }
    .phrase-chip {
      padding: 9px 12px; border-radius: 14px;
      background: var(--pill-bg); border: 1px solid var(--divider); cursor: pointer;
    }
    .phrase-en { font-family: var(--font-serif); font-size: 15px; color: var(--fg); }
    .phrase-cn { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }

    .morpheme-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 12px; text-align: left; }
    .morpheme-chip {
      padding: 6px 11px; border-radius: 13px;
      background: var(--pill-bg); border: 1px solid var(--glass-border);
      display: flex; flex-direction: column; gap: 2px;
    }
    .morpheme-chip.root {
      background: rgba(var(--primary-rgb), 0.16);
      border-color: rgba(var(--primary-rgb), 0.36);
    }
    .morpheme-text { font-family: var(--font-serif); font-size: 19px; line-height: 1.1; }
    .morpheme-chip.root .morpheme-text { color: var(--primary); }
    .morpheme-meaning { font-size: 11px; color: var(--muted-fg); }
    .morpheme-plus { font-family: var(--font-serif); font-size: 16px; opacity: 0.55; }
    .derivation-text { font-size: 13.5px; line-height: 1.62; text-align: left; }

    /* ===== 底部快捷键提示条 ===== */
    .bottom-bar {
      width: min(1020px, 95vw);
      padding: 9px 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: inset 0 1px 0 var(--glass-highlight);
      font-size: 13px;
      color: var(--muted-fg);
    }
    .shortcut-list { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .shortcut-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: none; color: var(--muted-fg);
      font-size: 12.5px; cursor: pointer;
    }
    .shortcut-btn:hover { color: var(--fg); }
    kbd {
      height: 22px; min-width: 22px; padding: 0 6px;
      border-radius: 6px; background: var(--kbd-bg);
      border: 1px solid var(--glass-border); border-bottom-width: 2px;
      font-family: var(--font-mono); font-size: 11px; color: var(--fg-soft);
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* =====================================================================
       交互 06：底部玻璃停靠栏 (GLASS DOCK — macOS 磁力波浪放大)
       ===================================================================== */
    .glass-dock-wrap {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) translateY(90px);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }
    [data-nav="dock"] .glass-dock-wrap {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .glass-dock {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 8px 14px;
      height: 60px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      box-shadow: inset 0 1.5px 0 var(--glass-highlight), 0 18px 42px -12px rgba(0, 0, 0, 0.32);
    }
    .dock-item {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: var(--pill-bg);
      color: var(--fg-soft);
      display: grid;
      place-items: center;
      cursor: pointer;
      transform-origin: bottom center;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, color 0.2s ease;
      will-change: transform;
    }
    .dock-item.active {
      color: var(--primary);
      background: rgba(var(--primary-rgb), 0.18);
      border-color: rgba(var(--primary-rgb), 0.38);
    }
    .dock-item.active::after {
      content: "";
      position: absolute;
      bottom: -5px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--primary);
    }
    .dock-tooltip {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      color: var(--fg);
      font-size: 11.5px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.35);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .dock-sep {
      width: 1px;
      height: 26px;
      background: var(--divider);
      margin: 0 3px 8px;
    }

    /* =====================================================================
       交互 05：命令面板 (COMMAND PALETTE — Ctrl+K / ⌘K)
       ===================================================================== */
    .cmd-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.26);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 13vh;
    }
    .cmd-backdrop.open { display: flex; }

    .cmd-modal {
      width: min(560px, 92vw);
      border-radius: 24px;
      overflow: hidden;
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(32px) saturate(150%);
      -webkit-backdrop-filter: blur(32px) saturate(150%);
      box-shadow: inset 0 1.5px 0 var(--glass-highlight), 0 30px 70px -16px rgba(0, 0, 0, 0.45);
      animation: cmd-pop 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cmd-pop {
      from { opacity: 0; transform: scale(0.95) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .cmd-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--divider);
    }
    .cmd-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--fg);
      font-size: 15px;
      font-family: var(--font-sans);
    }
    .cmd-input::placeholder { color: var(--muted-fg); }

    .cmd-list {
      max-height: 330px;
      overflow-y: auto;
      padding: 8px;
    }
    .cmd-section {
      font-size: 11px;
      color: var(--muted-fg);
      padding: 6px 10px 4px;
      letter-spacing: 0.04em;
    }
    .cmd-item {
      width: 100%;
      padding: 9px 12px;
      border-radius: 13px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-soft);
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      transition: all 0.14s ease;
    }
    .cmd-item.selected, .cmd-item:hover {
      background: rgba(var(--primary-rgb), 0.14);
      border-color: rgba(var(--primary-rgb), 0.28);
      color: var(--fg);
    }
    .cmd-item mark {
      background: transparent;
      color: var(--primary);
      font-weight: 600;
    }
    .cmd-sub { font-size: 12px; color: var(--muted-fg); }

    /* Toast 提示 */
    .toast {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 90;
      padding: 9px 15px;
      border-radius: 999px;
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      color: var(--fg);
      font-size: 12.5px;
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 960px) {
      .sidebar { display: none; }
      .stage-modules { grid-template-columns: 1fr; }
      .nav-drop-btn { display: none; }
    }

    /* =====================================================================
       交互 01：左侧液态高亮块 (LIQUID PILL) — 带速度拉伸与弹簧回弹
       ===================================================================== */
    const sidebarNav = document.getElementById("sidebarNav");
    const liquidNavPill = document.getElementById("liquidNavPill");
    let currentPillY = 0;

    function buildSidebarAndDock() {
      // 渲染侧栏
      NAV_ITEMS.forEach((item) => {
        const btn = document.createElement("button");
        btn.className = `nav-item ${item.id === state.activeNav ? "active" : ""}`;
        btn.dataset.navId = item.id;
        btn.innerHTML = `${item.icon}<span>${item.label}</span>`;
        btn.addEventListener("click", () => selectNav(item.id));
        sidebarNav.appendChild(btn);
      });

      // 渲染底部玻璃停靠栏（取高频 8 个 + 切换回侧栏按钮）
      const dock = document.getElementById("glassDock");
      const dockIds = ["dictionary", "learn", "dictation", "phonetics", "books", "errors", "radio", "reading"];
      dockIds.forEach((id) => {
        const item = NAV_ITEMS.find((n) => n.id === id);
        const btn = document.createElement("button");
        btn.className = `dock-item ${id === state.activeNav ? "active" : ""}`;
        btn.dataset.navId = id;
        btn.innerHTML = `${item.icon}<span class="dock-tooltip">${item.label}</span>`;
        btn.addEventListener("click", () => selectNav(id));
        dock.appendChild(btn);
      });

      const sep = document.createElement("div");
      sep.className = "dock-sep";
      dock.appendChild(sep);

      const backSide = document.createElement("button");
      backSide.className = "dock-item";
      backSide.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg><span class="dock-tooltip">切回左侧菜单</span>`;
      backSide.onclick = () => setNavMode("sidebar");
      dock.appendChild(backSide);

      requestAnimationFrame(() => moveLiquidNavPill(state.activeNav, false));
    }

    function moveLiquidNavPill(navId, animate = true) {
      const target = sidebarNav.querySelector(`[data-nav-id="${navId}"]`);
      if (!target) return;
      const nextY = target.offsetTop;
      const dist = Math.abs(nextY - currentPillY);

      if (!animate) {
        liquidNavPill.style.transition = "none";
        liquidNavPill.style.transform = `translateY(${nextY}px) scaleY(1)`;
        currentPillY = nextY;
        return;
      }

      // 液态果冻拉伸：距离越远拉伸越明显，再弹性回正
      const stretchY = Math.min(1.42, 1 + dist / 240);
      const midY = currentPillY + (nextY - currentPillY) * 0.55;

      liquidNavPill.animate(
        [
          { transform: `translateY(${currentPillY}px) scaleY(1) scaleX(1)` },
          { transform: `translateY(${midY}px) scaleY(${stretchY}) scaleX(0.95)`, offset: 0.42 },
          { transform: `translateY(${nextY}px) scaleY(0.94) scaleX(1.03)`, offset: 0.78 },
          { transform: `translateY(${nextY}px) scaleY(1) scaleX(1)` }
        ],
        { duration: 420, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
      );
      currentPillY = nextY;
    }

    function selectNav(navId) {
      state.activeNav = navId;
      document.querySelectorAll(".nav-item[data-nav-id]").forEach((el) => {
        el.classList.toggle("active", el.dataset.navId === navId);
      });
      document.querySelectorAll(".dock-item[data-nav-id]").forEach((el) => {
        el.classList.toggle("active", el.dataset.navId === navId);
      });
      moveLiquidNavPill(navId, true);
      const item = NAV_ITEMS.find((n) => n.id === navId);
      if (item && navId !== "learn") {
        showToast(`已选中「${item.label}」（当前为单词学习页交互演示）`);
      }
    }

    /* =====================================================================
       交互 06：底部玻璃停靠栏 (GLASS DOCK — macOS 磁力波浪放大)
       ===================================================================== */
    const glassDock = document.getElementById("glassDock");
    glassDock.addEventListener("mousemove", (e) => {
      const items = glassDock.querySelectorAll(".dock-item");
      items.forEach((item) => {
        const rect = item.getBoundingClientRect();
        const center = rect.left + rect.width / 2;
        const dist = Math.abs(e.clientX - center);
        const radius = 115;
        if (dist < radius) {
          const factor = Math.cos((dist / radius) * (Math.PI / 2));
          const scale = 1 + factor * 0.44;
          const lift = factor * 10;
          item.style.transform = `translateY(${-lift}px) scale(${scale})`;
        } else {
          item.style.transform = "translateY(0) scale(1)";
        }
      });
    });
    glassDock.addEventListener("mouseleave", () => {
      glassDock.querySelectorAll(".dock-item").forEach((item) => {
        item.style.transform = "translateY(0) scale(1)";
      });
    });

    /* =====================================================================
       交互 02：光跟着鼠标走 (LIGHT FOLLOW + 局部边框点亮 + 轻微 3D 倾角)
       ===================================================================== */
    document.querySelectorAll(".light-card").forEach((card) => {
      const maxTilt = parseFloat(card.dataset.tilt || "2");
      card.addEventListener("pointermove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty("--mx", `${x}px`);
        card.style.setProperty("--my", `${y}px`);
        const rx = ((y / rect.height) - 0.5) * -maxTilt * 2;
        const ry = ((x / rect.width) - 0.5) * maxTilt * 2;
        card.style.transform = `perspective(1000px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
      });
      card.addEventListener("pointerleave", () => {
        card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg)";
      });
    });

    const cmdBackdrop = document.getElementById("cmdBackdrop");

    function getCommands() {
      return [

    function openCmd() {
      cmdBackdrop.classList.add("open");
      document.body.classList.add("cmd-open");
      cmdInput.value = "";
      cmdActiveIdx = 0;
      renderCmdList("");
      setTimeout(() => cmdInput.focus(), 20);
    }
    function closeCmd() {
      cmdBackdrop.classList.remove("open");
      document.body.classList.remove("cmd-open");
    }

    function highlight(text, q) {
      if (!q) return text;
      const safe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return text.replace(new RegExp(`(${safe})`, "ig"), "<mark>$1</mark>");
    }

    function renderCmdList(query) {
      const q = query.trim().toLowerCase();
      cmdFiltered = getCommands().filter((c) => !q || c.title.toLowerCase().includes(q) || c.sub.toLowerCase().includes(q));
      if (cmdActiveIdx >= cmdFiltered.length) cmdActiveIdx = 0;

      if (!cmdFiltered.length) {
        cmdList.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted-fg);font-size:13px;">未找到匹配命令或单词</div>`;
        return;
      }

      let html = "";
      let lastGroup = "";
      cmdFiltered.forEach((item, idx) => {
        if (item.group !== lastGroup) {
          html += `<div class="cmd-section">${item.group}</div>`;
          lastGroup = item.group;
        }
        html += `
          <button class="cmd-item ${idx === cmdActiveIdx ? "selected" : ""}" data-cmd-idx="${idx}">
            <span>${highlight(item.title, query.trim())}</span>
            <span class="cmd-sub">${item.sub}</span>
          </button>
        `;
      });
      cmdList.innerHTML = html;
    }

    cmdInput.addEventListener("input", () => { cmdActiveIdx = 0; renderCmdList(cmdInput.value); });
    cmdList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cmd-idx]");
      if (!btn) return;
      const item = cmdFiltered[Number(btn.dataset.cmdIdx)];
      if (item) { closeCmd(); item.run(); }
    });
    cmdBackdrop.addEventListener("click", (e) => { if (e.target === cmdBackdrop) closeCmd(); });

    const wordHeadline = document.getElementById("wordHeadline");

    const typingStage = document.getElementById("typingStage");
    const typingSlots = document.getElementById("typingSlots");
    const contextBody = document.getElementById("contextBody");
    const contextMeta = document.getElementById("contextMeta");

    const contextTabPill = document.getElementById("contextTabPill");

    function updateContextTabPill() {
      const activeTab = document.querySelector("#contextTabs .seg-tab.active");
      if (!activeTab) return;
      contextTabPill.style.width = `${activeTab.offsetWidth}px`;
      contextTabPill.style.transform = `translateX(${activeTab.offsetLeft - 3}px)`;
    }

    function renderHeadline(word) {
      if (!state.isSplit) {
        let comboRun = 0;
        wordHeadline.innerHTML = word.segments.map((seg) => {
          let cls = "";
          if (seg.k === "v") { cls = "seg-vowel"; comboRun = 0; }
          else if (seg.k === "combo") { cls = comboRun % 2 === 0 ? "seg-combo" : "seg-combo-alt"; comboRun++; }
          else { comboRun = 0; }
          return `<span class="${cls}">${seg.t}</span>`;
        }).join("");
      } else {
        wordHeadline.innerHTML = word.syllables.map((syl, idx) => {
          const dot = idx > 0 ? `<span class="syl-dot">·</span>` : "";
          const colored = syl.replace(/[aeiou]+/gi, (m) => `<span class="seg-vowel">${m}</span>`);
          return `${dot}<span>${colored}</span>`;
        }).join("");
      }
    }

    function renderTyping(word, rippleIdx = -1) {
      const target = word.name;
      const total = Math.max(target.length, state.input.length);
      typingStage.classList.toggle("typo", state.hasTypo);
      let html = "";
      for (let i = 0; i < total; i++) {
        const isTyped = i < state.input.length;
        const isCurrent = i === state.input.length;
        const ch = state.input[i] || "";
        const ok = isTyped && target[i] && ch.toLowerCase() === target[i].toLowerCase();
        html += `
          <div class="char-slot ${isTyped ? "filled" : ""}">
            ${isCurrent ? `<span class="caret"></span>` : ""}
            ${isTyped ? `<span class="typed-char ${ok ? "" : "wrong"}">${ch}</span>` : ""}
            ${i === rippleIdx ? `<span class="key-ripple"></span>` : ""}
            <span class="dash"></span>
          </div>
        `;
      }
      typingSlots.innerHTML = html;
    }

    function renderContext(word) {
      if (state.tab === "examples") {
        contextMeta.textContent = `${word.examples.length} 条`;
        contextBody.innerHTML = `<div class="sentence-list">${word.examples.map((ex, i) => `
          <div class="sentence-item">
            <span class="sentence-idx">${i + 1}</span>
            <div>
              <div class="sentence-en">${ex.en.replace(new RegExp(`(${word.name})`, "i"), `<span class="hl-word">$1</span>`)}</div>
              <div class="sentence-cn">${ex.cn}</div>
            </div>
            <button class="mini-audio-btn" data-sentence="${ex.en.replace(/"/g, "&quot;")}" title="朗读例句">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
          </div>
        `).join("")}</div>`;
      } else {
        contextMeta.textContent = `${word.phrases.length} 条`;
        contextBody.innerHTML = `<div class="phrases-grid">${word.phrases.map((ph) => `
          <div class="phrase-chip" data-sentence="${ph.en.replace(/"/g, "&quot;")}">
            <div class="phrase-en">${ph.en}</div>
            <div class="phrase-cn">${ph.cn}</div>
          </div>
        `).join("")}</div>`;
      }

      etymologyBody.innerHTML = `
        <div class="morpheme-row">
          ${word.morphemes.map((m, i) => `
            ${i > 0 ? `<span class="morpheme-plus">+</span>` : ""}
            <div class="morpheme-chip ${m.role === "root" ? "root" : ""}">
              <span class="morpheme-text">${m.text}</span>
              <span class="morpheme-meaning">${m.meaning}</span>
            </div>
          `).join("")}
        </div>
        <p class="derivation-text">${word.derivation}</p>
      `;
    }

    function renderAll(rippleIdx = -1) {
      const w = WORDS[state.index];
      renderHeadline(w);
      phoneticsRow.innerHTML = [
        { k: "us", label: "美", text: w.us },
        { k: "uk", label: "英", text: w.uk }
      ].map((p) => `
        <button class="phonetic-pill" data-speak="${p.k}">
          <span class="tag">${p.label}</span>
          <span class="ipa">${p.text}</span>
        </button>
      `).join("");
      wordMeaning.innerHTML = `<span class="pos">${w.pos}</span>${w.meaning}`;
      renderTyping(w, rippleIdx);
      renderContext(w);

      document.getElementById("wordCounter").textContent = `${state.index + 1} / ${WORDS.length}`;
      document.getElementById("progressFill").style.width = `${((state.index + 1) / WORDS.length) * 100}%`;

      const done = state.loopSetting - state.remainingLoops;
      document.getElementById("loopDots").innerHTML = Array.from({ length: state.loopSetting })
        .map((_, i) => `<span class="loop-dot ${i < done ? "filled" : ""}"></span>`).join("");
      document.getElementById("loopText").textContent = `还需再打 ${state.remainingLoops} 遍`;

      const splitBtn = document.getElementById("splitBtn");
      splitBtn.classList.toggle("active", state.isSplit);
      document.getElementById("splitBtnText").textContent = state.isSplit ? "合并" : "音节";

      const isStarred = state.starred.has(w.name);
      const starBtn = document.getElementById("starBtn");
      starBtn.classList.toggle("starred", isStarred);
      document.getElementById("starBtnText").textContent = isStarred ? "★ 已在生词本" : "☆ 生词本";
    }

    function switchWord(delta) {
      state.index = (state.index + delta + WORDS.length) % WORDS.length;
      state.input = "";
      state.hasTypo = false;
      state.remainingLoops = state.loopSetting;
      renderAll();
    }

    function setBg(bg) {
      document.documentElement.dataset.bg = bg;
      document.querySelectorAll("[data-set-bg]").forEach((b) => b.classList.toggle("active", b.dataset.setBg === bg));
    }
    function setNavMode(mode) {
      document.documentElement.dataset.nav = mode;
      document.querySelectorAll("[data-set-nav]").forEach((b) => b.classList.toggle("active", b.dataset.setNav === mode));
      if (mode === "sidebar") setTimeout(() => moveLiquidNavPill(state.activeNav, false), 320);
    }

    // 键盘交互（命令面板优先，其次单词跟打）
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        if (cmdBackdrop.classList.contains("open")) closeCmd();
        else openCmd();
        return;
      }

      if (cmdBackdrop.classList.contains("open")) {
        if (e.key === "Escape") { e.preventDefault(); closeCmd(); return; }
        if (e.key === "ArrowDown") { e.preventDefault(); cmdActiveIdx = (cmdActiveIdx + 1) % Math.max(1, cmdFiltered.length); renderCmdList(cmdInput.value); return; }
        if (e.key === "ArrowUp") { e.preventDefault(); cmdActiveIdx = (cmdActiveIdx - 1 + cmdFiltered.length) % Math.max(1, cmdFiltered.length); renderCmdList(cmdInput.value); return; }
        if (e.key === "Enter" && cmdFiltered[cmdActiveIdx]) { e.preventDefault(); const item = cmdFiltered[cmdActiveIdx]; closeCmd(); item.run(); return; }
        return;
      }

      if (e.key === "Escape" && state.expandedModule) { setExpandedModule(state.expandedModule); return; }
      if (e.altKey && e.key.toLowerCase() === "s") { e.preventDefault(); state.isSplit = !state.isSplit; renderAll(); return; }
      if (e.altKey && e.key.toLowerCase() === "w") {
        e.preventDefault();
        const name = WORDS[state.index].name;
        if (state.starred.has(name)) state.starred.delete(name); else state.starred.add(name);
        renderAll();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "j") { e.preventDefault(); speakText(WORDS[state.index].name); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); switchWord(-1); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); switchWord(1); return; }
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      const w = WORDS[state.index];
      if (e.key === "Backspace") {
        e.preventDefault();
        state.input = state.input.slice(0, -1);
        state.hasTypo = !w.name.toLowerCase().startsWith(state.input.toLowerCase());
        renderTyping(w);
        return;
      }
      if (/^[a-zA-Z]$/.test(e.key)) {
        e.preventDefault();
        if (state.input.length >= w.name.length) return;
        const expected = w.name[state.input.length];
        state.input += e.key;
        state.hasTypo = !w.name.toLowerCase().startsWith(state.input.toLowerCase());
        if (e.key.toLowerCase() !== expected.toLowerCase()) {
          typingStage.classList.remove("shake");
          void typingStage.offsetWidth;
          typingStage.classList.add("shake");
          renderTyping(w);
        } else {
          renderTyping(w, state.input.length - 1);
          if (state.input.toLowerCase() === w.name.toLowerCase()) {
            speakText(w.name);
            setTimeout(() => {
              if (state.remainingLoops > 1) {
                state.remainingLoops--; state.input = ""; state.hasTypo = false; renderAll();
              } else {
                switchWord(1);
              }
            }, 360);
          }
        }
      }
    });

    // 绑定点击事件
    document.querySelectorAll("[data-set-bg]").forEach((b) => b.onclick = () => setBg(b.dataset.setBg));
    document.querySelectorAll("[data-set-nav]").forEach((b) => b.onclick = () => setNavMode(b.dataset.setNav));
    document.getElementById("switchToDockBtn").onclick = () => setNavMode("dock");
    document.getElementById("openCmdSidebarBtn").onclick = openCmd;
    document.getElementById("openCmdTopBtn").onclick = openCmd;
    document.getElementById("footCmdBtn").onclick = openCmd;
    document.getElementById("prevBtn").onclick = () => switchWord(-1);
    document.getElementById("nextBtn").onclick = () => switchWord(1);
    document.getElementById("footPrevBtn").onclick = () => switchWord(-1);
    document.getElementById("footNextBtn").onclick = () => switchWord(1);
    document.getElementById("splitBtn").onclick = () => { state.isSplit = !state.isSplit; renderAll(); };
    document.getElementById("footSplitBtn").onclick = () => { state.isSplit = !state.isSplit; renderAll(); };
    document.getElementById("starBtn").onclick = () => {
      const n = WORDS[state.index].name;
      if (state.starred.has(n)) state.starred.delete(n); else state.starred.add(n);
      renderAll();
    };
    document.getElementById("footStarBtn").onclick = () => document.getElementById("starBtn").click();
    document.getElementById("footSpeakBtn").onclick = () => speakText(WORDS[state.index].name);
    document.getElementById("restartBtn").onclick = () => {
      state.index = 0; state.input = ""; state.hasTypo = false; state.remainingLoops = state.loopSetting; renderAll();
    };
    document.getElementById("settingsNavBtn").onclick = () => showToast("偏好设置（预览页示意）");

    document.querySelectorAll("#contextTabs .seg-tab").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll("#contextTabs .seg-tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.tab = btn.dataset.tab;
        updateContextTabPill();
        renderContext(WORDS[state.index]);
      };
    });

    document.addEventListener("click", (e) => {
      const sp = e.target.closest("[data-speak]");
      if (sp) { speakText(WORDS[state.index].name, sp.dataset.speak); return; }
      const sent = e.target.closest("[data-sentence]");
      if (sent) { speakText(sent.dataset.sentence); return; }
    });

    buildSidebarAndDock();
    renderAll();
    requestAnimationFrame(updateContextTabPill);
    window.addEventListener("resize", () => {
      moveLiquidNavPill(state.activeNav, false);
      updateContextTabPill();
    });
  </script>
</body>
</html>
